<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SQL侦探 - 自动化测试</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #e8e8e8; padding: 20px; }
        h1 { color: #00d4aa; }
        .suite { margin: 20px 0; padding: 16px; background: #16213e; border-radius: 6px; }
        .suite h2 { color: #ffa502; margin-bottom: 10px; font-size: 1rem; }
        .pass { color: #2ed573; }
        .fail { color: #ff4757; }
        .result { padding: 4px 0; font-size: 0.9rem; }
        .summary { margin-top: 20px; padding: 16px; background: #0f3460; border-radius: 6px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>SQL侦探 - 浏览器自动化测试</h1>
    <div id="test-output"></div>
    <div id="summary" class="summary"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/cases.js"></script>
    <script>
    (async function runTests() {
        const output = document.getElementById('test-output');
        let passed = 0, failed = 0;

        function assert(condition, message) {
            if (condition) { passed++; log(message, true); }
            else { failed++; log(message, false); }
        }

        function log(msg, pass) {
            const div = document.createElement('div');
            div.className = 'result ' + (pass ? 'pass' : 'fail');
            div.textContent = (pass ? '✓ ' : '✗ ') + msg;
            output.lastElementChild.appendChild(div);
        }

        function suite(name) {
            const div = document.createElement('div');
            div.className = 'suite';
            div.innerHTML = `<h2>${name}</h2>`;
            output.appendChild(div);
        }

        await DatabaseManager.init();

        // === Database Init ===
        suite('数据库初始化');

        const tables = DatabaseManager.db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
        assert(tables[0].values.length === 11, `有11张表 (实际: ${tables[0].values.length})`);

        const recordCount = DatabaseManager.getRecordCount();
        assert(recordCount >= 80, `记录总数 ≥ 80 (实际: ${recordCount})`);
        assert(recordCount <= 300, `记录总数 ≤ 300 (实际: ${recordCount})`);

        // === Security - Basic ===
        suite('安全性 - 基础阻止');

        const basicAttacks = [
            "INSERT INTO persons VALUES (99,'x','男',1,'','','','')",
            "UPDATE persons SET name='x'",
            "DELETE FROM persons",
            "DROP TABLE persons",
            "CREATE TABLE x(i INT)",
            "ALTER TABLE persons RENAME TO x",
            "ATTACH DATABASE ':memory:' AS hack",
            "PRAGMA table_info(persons)",
        ];
        basicAttacks.forEach(q => {
            let blocked = false;
            try { DatabaseManager.executeQuery(q); } catch(e) { blocked = true; }
            assert(blocked, `阻止: ${q.substring(0, 50)}`);
        });

        // === Security - WITH bypass ===
        suite('安全性 - WITH绕过攻击');

        const withBypass = [
            "WITH x AS (SELECT 1) DELETE FROM persons",
            "WITH x AS (SELECT 1) UPDATE persons SET name='hacked'",
            "WITH x AS (SELECT 1) INSERT INTO persons VALUES (99,'x','男',1,'','','','')",
            "WITH x AS (SELECT 1) DROP TABLE persons",
            "WITH a AS (SELECT * FROM persons) DELETE FROM persons WHERE id IN (SELECT id FROM a)",
            "WITH RECURSIVE x(n) AS (SELECT 1 UNION ALL SELECT n+1 FROM x) DELETE FROM persons",
        ];
        withBypass.forEach(q => {
            let blocked = false;
            try { DatabaseManager.executeQuery(q); } catch(e) { blocked = true; }
            assert(blocked, `WITH绕过阻止: ${q.substring(0, 55)}`);
        });

        const personsAfter = DatabaseManager.db.exec("SELECT COUNT(*) FROM persons")[0].values[0][0];
        assert(personsAfter === 25, `攻击后数据完好 (${personsAfter}条)`);

        // === Security - false positive ===
        suite('安全性 - 字符串内关键词不误拦');

        const safeQueries = [
            "SELECT * FROM persons WHERE name LIKE '%DELETE%'",
            "SELECT 'INSERT INTO test' AS example",
            "SELECT * FROM evidence WHERE description LIKE '%UPDATE%'",
        ];
        safeQueries.forEach(q => {
            let ok = false;
            try { ok = DatabaseManager.executeQuery(q).rowCount >= 0; } catch(e) {}
            assert(ok, `不误拦: ${q.substring(0, 55)}`);
        });

        // === Multi-statement injection ===
        suite('安全性 - 多语句注入');

        ["SELECT 1; DROP TABLE persons", "SELECT 1; DELETE FROM persons"].forEach(q => {
            let blocked = false;
            try { DatabaseManager.executeQuery(q); } catch(e) { blocked = true; }
            assert(blocked, `阻止: ${q}`);
        });

        // === Valid Queries ===
        suite('有效查询执行');

        const validQ = [
            "SELECT * FROM persons LIMIT 3",
            "SELECT COUNT(*) FROM events WHERE case_id = 1",
            "WITH s AS (SELECT * FROM surveillance) SELECT COUNT(*) FROM s",
            "SELECT DISTINCT case_id FROM events ORDER BY case_id",
        ];
        validQ.forEach(q => {
            let ok = false;
            try { ok = DatabaseManager.executeQuery(q).rowCount >= 0; } catch(e) {}
            assert(ok, `执行成功: ${q.substring(0, 60)}`);
        });

        // === Answer Verification - correct ===
        suite('答案验证 - 正确答案');

        let r1 = CaseManager.verifyAnswer('case1', '林美玲',
            "SELECT * FROM financial_records WHERE person_id = 4 AND description LIKE '%氰化%'", '争夺遗产');
        assert(r1.success, '案件1完整通过');

        let r2 = CaseManager.verifyAnswer('case2', '周小燕',
            "SELECT * FROM evidence WHERE case_id = 2 AND description LIKE '%周小燕%'", '挪用公款威胁顶罪');
        assert(r2.success, '案件2完整通过');

        let r3 = CaseManager.verifyAnswer('case3', '钱进',
            "SELECT * FROM surveillance WHERE person_id = 16 AND description LIKE '%病房%'", '赌债');
        assert(r3.success, '案件3完整通过');

        // === Answer Verification - false positives ===
        suite('答案验证 - 泛查询误判防护');

        let rGen1 = CaseManager.verifyAnswer('case1', '林美玲',
            "SELECT * FROM evidence WHERE case_id = 1", '遗产');
        assert(!rGen1.evidenceValid, '泛查询evidence全表不通过');

        let rGen2 = CaseManager.verifyAnswer('case2', '周小燕',
            "SELECT * FROM events WHERE case_id = 2", '挪用');
        assert(!rGen2.evidenceValid, '泛查询events全表不通过');

        let rTrivial = CaseManager.verifyAnswer('case1', '林美玲', "SELECT 1", '遗产');
        assert(!rTrivial.evidenceValid, 'SELECT 1 不通过');

        let rWrongPerson = CaseManager.verifyAnswer('case1', '林美玲',
            "SELECT * FROM financial_records WHERE person_id = 3", '遗产');
        assert(!rWrongPerson.evidenceValid, '查错误人员不通过');

        // === Wrong answers ===
        suite('答案验证 - 错误答案');

        let rW = CaseManager.verifyAnswer('case1', '王管家', "SELECT 1", '仇恨');
        assert(!rW.success, '错误凶手不通过');

        let rInv = CaseManager.verifyAnswer('case999', '某人', '', '');
        assert(!rInv.success, '无效案件不通过');

        // === Data quality ===
        suite('数据完整性');

        const rh = DatabaseManager.db.exec("SELECT COUNT(*) FROM evidence WHERE is_red_herring = 1")[0].values[0][0];
        assert(rh >= 3, `伪线索≥3 (${rh})`);

        const uv = DatabaseManager.db.exec("SELECT COUNT(*) FROM alibis WHERE verified = 0")[0].values[0][0];
        assert(uv >= 3, `未验证不在场证明≥3 (${uv})`);

        for (let c = 1; c <= 3; c++) {
            const ev = DatabaseManager.db.exec(`SELECT COUNT(*) FROM evidence WHERE case_id = ${c}`)[0].values[0][0];
            assert(ev >= 5, `案件${c}证据≥5 (${ev})`);
        }

        // === Summary ===
        const summary = document.getElementById('summary');
        const total = passed + failed;
        summary.innerHTML = `测试完成: <span class="pass">${passed} 通过</span> / <span class="fail">${failed} 失败</span> / 共 ${total} 项`;
        summary.style.borderLeft = failed === 0 ? '4px solid #2ed573' : '4px solid #ff4757';
    })();
    </script>
</body>
</html>
